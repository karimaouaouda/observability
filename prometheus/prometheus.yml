global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: droven_application
    scheme: https
    metrics_path: /api/v1/observability/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/droven_metrics.token
    static_configs:
      - targets:
          - droven.karimaouaouda.space
        labels:
          app: drovenai
          service: backend
          environment: production
          instance: droven.karimaouaouda.space

  - job_name: applications
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/applications.yml
        refresh_interval: 30s

  - job_name: hosts
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/hosts.yml
        refresh_interval: 30s
